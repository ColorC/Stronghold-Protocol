<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>实战 VFX 对比 · 卫戍协议</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230c0f0e'/%3E%3Cpath fill='%234ed8af' d='M5 3h3v2h2V3h4v2h2V3h3v5l-2 2v7l2 2v2H5v-2l2-2v-7L5 8z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <script src="/vendor/pixi.min.js"></script>
  <script src="/vendor/pixi-spine.js"></script>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; background: #080b0a; color: #d6dfda; font: 14px/1.4 "Noto Sans SC", system-ui, sans-serif; }
    body { overflow: auto; }
    .vc-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .vc-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid #27322d; background: rgba(9, 13, 12, .96); }
    .vc-kicker { color: #4ed8af; font: 11px/1 Bender, Oxanium, monospace; letter-spacing: .12em; }
    h1 { margin: 0; font-size: 19px; font-weight: 700; color: #f4f7f5; }
    .vc-explain { color: #9aa8a1; max-width: 720px; }
    .vc-top a, .vc-top button, .vc-controls button, .vc-controls select { color: #e9efec; background: #19211e; border: 1px solid #3b4c45; border-radius: 4px; padding: 7px 10px; font: inherit; text-decoration: none; cursor: pointer; }
    .vc-top a:hover, .vc-top button:hover, .vc-controls button:hover { border-color: #4ed8af; }
    .vc-top .vc-link { margin-left: auto; }
    .vc-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 18px; border-bottom: 1px solid #202a25; background: #0d1210; }
    .vc-controls button.is-on { border-color: #4ed8af; color: #4ed8af; }
    .vc-controls .vc-label { color: #87958e; font-size: 12px; }
    .vc-stage { flex: 1; min-height: 560px; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #35433d; }
    .vc-pane { min-width: 0; display: flex; flex-direction: column; background: #0a0f0d; }
    .vc-pane-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 12px; background: rgba(13, 19, 17, .96); border-bottom: 1px solid #2a3730; }
    .vc-pane-title { font-weight: 700; color: #f3f6f4; }
    .vc-pane-title small { display: block; margin-top: 2px; color: #839189; font-size: 11px; font-weight: 400; }
    .vc-stats { color: #8ea198; font: 11px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace; text-align: right; white-space: pre; }
    .vc-field { position: relative; flex: 1; min-height: 500px; }
    .vc-field canvas { display: block; width: 100%; height: 100%; }
    .vc-footer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 42px; padding: 7px 18px; border-top: 1px solid #27322d; background: #0d1210; color: #8e9d95; }
    .vc-status { flex: 1; min-width: 260px; }
    .vc-status strong { color: #4ed8af; }
    .vc-errors { color: #ff8d8d; }
    @media (max-width: 900px) { .vc-stage { grid-template-columns: 1fr; } .vc-field { min-height: 420px; } .vc-top .vc-link { margin-left: 0; } }
  </style>
</head>
<body>
  <main class="vc-shell">
    <header class="vc-top">
      <span class="vc-kicker">BATTLE VFX REVIEW</span>
      <h1>实战表现对比</h1>
      <span class="vc-explain">同一套战斗事件同步播放；右侧只启用反编译动作槽里确认过的角色 VFX，未确认的命中与投射保留基线。</span>
      <a class="vc-link" href="./vfx-compare.html" target="_blank" rel="noreferrer">单独打开</a>
    </header>
    <nav class="vc-controls" aria-label="对比控制">
      <span class="vc-label">角色</span>
      <button type="button" data-operator="rosmon" class="is-on">迷迭香</button>
      <button type="button" data-operator="blkkgt">锏</button>
      <span class="vc-label">场景</span>
      <button type="button" data-scenario="full" class="is-on">完整流程</button>
      <button type="button" data-scenario="skchr_rosmon_1">技能一</button>
      <button type="button" data-scenario="skchr_rosmon_2">技能二</button>
      <button type="button" data-scenario="skchr_rosmon_3">技能三</button>
      <button type="button" data-action="toggle">❚❚</button>
      <button type="button" data-action="restart">重播</button>
      <label class="vc-label" for="speed">速度</label>
      <select id="speed" aria-label="播放速度">
        <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
      </select>
    </nav>
    <section class="vc-stage">
      <article class="vc-pane">
        <header class="vc-pane-head"><div class="vc-pane-title">加入前<small>原有程序化 FX</small></div><div class="vc-stats" id="before-stats">加载中</div></header>
        <div class="vc-field" id="before-field"></div>
      </article>
      <article class="vc-pane">
        <header class="vc-pane-head"><div class="vc-pane-title">加入后<small>按原版动作绑定播放的角色 VFX</small></div><div class="vc-stats" id="after-stats">加载中</div></header>
        <div class="vc-field" id="after-field"></div>
      </article>
    </section>
    <footer class="vc-footer"><span class="vc-status" id="status">正在加载战斗渲染器…</span><span class="vc-errors" id="errors"></span></footer>
  </main>
  <script type="module" src="./vfx-compare.js"></script>
</body>
</html>
