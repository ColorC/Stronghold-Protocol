<!doctype html><meta charset="utf-8"><body>
<script src="pixi.min.js"></script><script src="pixi-spine.js"></script>
<script>
// validate.html?skel=&lying=Die,Stun_Skill_3 : sample every clip at 60 fps in the real runtime and flag impossible poses:
// a knee bending backward, a thigh swung behind the body past its range or folded up over the body, a knee folded past its
// range, a foot below the floor, a head below the hips (outside clips allowed to lie down), a bone turning too fast.
(async () => {
  const q = new URLSearchParams(location.search), lying = new Set((q.get('lying') || '').split(',')), only = q.get('only') ? new Set(q.get('only').split(',')) : null;
  const res = await PIXI.Assets.load(q.get('skel')); const sd = res.spineData; const out = {};
  const deg = (r) => r * 180 / Math.PI, nrm = (a) => ((a + 180) % 360 + 360) % 360 - 180;
  for (const A of sd.animations) {
    if (/^(Pod_|Default|Idle|Hit)|_v1$/.test(A.name) || (only && !only.has(A.name))) continue;
    const sp = new PIXI.spine.Spine(sd); sp.autoUpdate = false; sp.state.setAnimation(0, A.name, false);
    const B = Object.fromEntries(sp.skeleton.bones.map((b) => [b.data.name, b])), P = (n) => [B[n].matrix.tx, -B[n].matrix.ty];
    const issues = {}, add = (k, t) => { (issues[k] = issues[k] || []).push(+t.toFixed(3)); };
    let prev = null, previousBlade = null; const N = Math.ceil(A.duration * 60);
    const bladeLength = Math.hypot(B.sword_tip.data.x, B.sword_tip.data.y);
    for (let f = 0; f <= N; f++) {
      const t = Math.min(A.duration, f / 60); if (f) sp.update(1 / 60); else sp.update(0);
      const hipM = [(P('thigh_r')[0] + P('thigh_l')[0]) / 2, (P('thigh_r')[1] + P('thigh_l')[1]) / 2], neck = P('head');
      const down = Math.atan2(hipM[1] - neck[1], hipM[0] - neck[0]);              // body axis, pointing from neck to hips
      const face = down + Math.PI / 2;                                                // facing direction (right at rest: down=-90 -> face=0)
      const rot = {};
      for (const s of ['r', 'l']) {
        const h = P(`thigh_${s}`), k = P(`shin_${s}`), a = P(`foot_${s}`);
        const th = Math.atan2(k[1] - h[1], k[0] - h[0]), sh = Math.atan2(a[1] - k[1], a[0] - k[0]);
        const flex = nrm(deg(th - down)) * (Math.sin(face - down) >= 0 ? 1 : -1);      // + = thigh swung toward the facing side
        const bend = nrm(deg(sh - th));
        if (flex < -50 || flex > 165) add(`thigh_${s} out of range`, t);
        // knee: the shin folds back behind the thigh line (for a right-facing figure bend is negative = shin turns clockwise)
        if (bend > 12) add(`knee_${s} bends backward`, t);
        if (bend < -160) add(`knee_${s} folded too far`, t);
        if (a[1] < -4) add(`foot_${s} below floor`, t);
        if (A.name === 'Stun_Skill_3' && s === 'r' && Math.abs(k[1] - 8) > 4) add('kneeling knee loses contact', t);
        if (A.name === 'Stun_Skill_3' && s === 'l') {
          let baseY = 0, base = B.foot_l; while (base) { baseY += base.data.y; base = base.parent; }
          if (Math.abs(a[1] - baseY) > 4) add('support foot loses contact', t);
        }
        rot[`thigh_${s}`] = deg(th); rot[`shin_${s}`] = deg(sh);
      }
      if (!lying.has(A.name) && neck[1] < hipM[1] - 5) add('head below hips', t);
      rot.torso = deg(down); rot.sword = deg(Math.atan2(P('sword_tip')[1] - P('sword')[1], P('sword_tip')[0] - P('sword')[0]));
      rot.upperarm_r = deg(Math.atan2(P('forearm_r')[1] - P('upperarm_r')[1], P('forearm_r')[0] - P('upperarm_r')[0]));
      const blade = [P('sword_tip')[0] - P('sword')[0], P('sword_tip')[1] - P('sword')[1]];
      if (previousBlade && Math.hypot(blade[0] - previousBlade[0], blade[1] - previousBlade[1]) > bladeLength * .5) add('sword tip jumps', t);
      if (A.name === 'Skill_1' && P('sword_tip')[1] < -4) add('sword tip below floor', t);
      if (prev) for (const [b, v] of Object.entries(rot)) {
        // At the edge-on instant the blade's projected direction is undefined.
        // Tip displacement is still checked; a long visible blade retains the
        // original angular gate, so the old stepped rotations still fail.
        if (b === 'sword' && previousBlade && Math.min(Math.hypot(...blade), Math.hypot(...previousBlade)) < bladeLength * .2) continue;
        const lim = b === 'sword' ? 75 : b.startsWith('upperarm') ? 45 : 22;          // per 1/60 s
        if (Math.abs(nrm(v - prev[b])) > lim) add(`${b} turns too fast`, t);
      }
      prev = rot; previousBlade = blade;
    }
    out[A.name] = Object.fromEntries(Object.entries(issues).map(([k, v]) => [k, `${v.length}x from ${v[0]}s`]));
  }
  window.info = out; window.png = null; document.title = 'ready';
})().catch((e) => { document.title = 'error: ' + e.message; });
</script>
