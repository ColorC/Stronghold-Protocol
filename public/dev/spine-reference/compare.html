<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2D 骨架并排比较</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f5;color:#203547;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{padding:16px;max-width:1800px;margin:auto}header,.row,.controls,.colhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:22px;margin:0}button,select,input{font:inherit}button,select{border:1px solid #bdcbd5;background:white;color:inherit;padding:6px 10px;border-radius:6px}label{display:flex;gap:5px;align-items:center}.controls{margin:12px 0}.profiles{display:flex;gap:12px;flex-wrap:wrap}.warning{color:#5b6f7c;margin:8px 0}.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}.col{min-width:0}.col pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto;font-size:12px}.timeline{flex-wrap:wrap}@media(max-width:1050px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.row{grid-template-columns:1fr}}.col{flex:1 1 300px;min-width:280px;border:1px solid #d1dce4;border-radius:9px;background:white;overflow:hidden}.colhead{padding:8px 10px;border-bottom:1px solid #e1e8ed}.colhead strong{margin-right:auto}.colhead a{font-size:12px}.stage{position:relative;height:min(65vh,560px);min-height:360px;background:linear-gradient(#f9fbfc,#e9eff3)}.stage canvas,.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}.limb{stroke:#558da8;stroke-width:.014;fill:none}.limb.weapon{stroke:#ef8b2d}.dot{stroke:#1c6d92;stroke-width:.008;fill:#78c2dc;cursor:pointer}.dot.weapon{fill:#f29435;stroke:#a94f00}.unknown{font-size:.05px;fill:#697782}.label{font-size:.055px;fill:#34596d;pointer-events:none}.timeline{display:flex;align-items:center;gap:10px;margin:10px 0}.timeline input{flex:1}.small{font-size:12px;color:#607583}a{color:#12679c}button{cursor:pointer}.hide{display:none!important}#error{color:#a12828;white-space:pre-wrap}body,body *{user-select:text}@media(max-width:700px){main{padding:8px}.stage{height:480px;min-height:300px}}
</style></head><body><main>
<header><h1>2D 骨架并排比较</h1><a id="full" target="_blank" rel="noopener">全屏打开</a></header>
<div class="controls"><span>素材：</span><div id="profiles" class="profiles"></div><label>对齐 <select id="align"><option value="progress">按动作进度</option><option value="seconds">按实际秒</option></select></label><button id="play">播放</button><button id="copy">复制当前比较链接</button></div>
<div class="timeline"><input id="time" type="range" min="0" max="1" step="0.001" value="0"><output id="clock">0.000</output><label>速度 <select id="speed"><option value="1">正常</option><option value="0.5">半速</option><option value="0.25">慢放</option></select></label><label>缩放 <input id="zoom" type="range" min="0.6" max="1.8" step="0.05" value="1"></label><output id="zoomValue">1.00×</output><label><input id="original" type="checkbox">切看原图叠点</label><label>轨迹 <select id="trail"><option value="none">关闭</option><option value="arm.L.wrist">腕 L链</option><option value="arm.R.wrist">腕 R链</option><option value="leg.L.knee">膝 L链</option><option value="leg.R.knee">膝 R链</option><option value="leg.L.ankle">踝 L链</option><option value="leg.R.ankle">踝 R链</option></select></label></div>
<p class="warning">骨架以共同语义点显示，以骨盆为原点，按固定参考尺寸比较；橙色标记持武器臂。按进度同步不代表发力时刻对齐；实际秒模式按秒取样。身体左右尚未核验。缺失绑定会保留为未知，位置查询仍使用共同语义。原图模式仅辅助观察，不作为绝对物理真值。</p><div id="error"></div><section id="columns" class="row"></section></main>
<script src="../../vendor/pixi.min.js"></script><script src="../../vendor/pixi-spine.js"></script><script type="module" src="./compare.js"></script></body></html>
