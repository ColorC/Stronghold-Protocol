<div id="error"></div><details><summary>查看这次尝试</summary><p>试版从待机的关节折向出发，手和剑跟随前臂，另一只手做小幅配合，双脚保持支撑。只调整这里的普攻，仍需观察轮廓、挥斩节奏与前后视角的表现。</p><p>“关节”显示模型中的肩、肘、腕和膝、踝；它们用于定位动作问题，不能单独证明动作好看。“此帧链接”保留朝向、部位和当前时刻，可直接复制给别人查看。</p></details>
