<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2B · 动作存档</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#20272d;color:#eef2f4;font:14px system-ui,"Microsoft YaHei",sans-serif}
    a{color:inherit}
    header{min-height:54px;padding:10px 18px;display:flex;align-items:center;gap:18px;border-bottom:1px solid #47515b}
    h1{font-size:18px;font-weight:600;margin:0}
    .summary{color:#c5d0d7}
    .header-links{margin-left:auto;display:flex;gap:14px;align-items:center}
    .header-links a{font-size:12px;color:#c5d0d7}
    main{height:calc(100dvh - 54px);min-height:420px;display:grid;grid-template-rows:minmax(0,1fr) auto}
    #scene{min-height:0;position:relative;overflow:hidden}
    canvas{display:block}
    footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid #47515b}
    button,select,.control{font:inherit;background:#303b46;color:inherit;border:1px solid #596575;border-radius:5px;padding:7px 11px}
    button,.control{cursor:pointer;text-decoration:none}
    .control{display:inline-flex;align-items:center}
    select{min-width:110px}
    #progress{flex:1;min-width:160px;accent-color:#8cdbc1}
    #time{min-width:92px;color:#c5d0d7;font-variant-numeric:tabular-nums}
    #error{position:absolute;left:18px;top:14px;color:#ffb0a8}
    .note{position:absolute;left:18px;bottom:9px;color:#aebbc4;font-size:12px;user-select:text}
    @media(max-width:680px){header{gap:9px;flex-wrap:wrap}.summary{font-size:12px}.header-links{gap:10px}footer{gap:6px;padding:8px}button,select,.control{padding:6px 8px;font-size:12px}select{min-width:92px}#progress{min-width:110px}}
  </style>
</head>
<body>
  <header>
    <h1>2B · 动作存档</h1>
    <span class="summary">试验已封档，可查看最后保留的动作。</span>
    <nav class="header-links" aria-label="页面链接">
      <a id="fullscreen" href="" target="_blank" rel="noopener">全屏打开</a>
      <a id="frameLink" href="">此帧链接</a>
    </nav>
  </header>
  <main>
    <div id="scene" aria-label="2B动作查看区域"><span id="error" role="status"></span></div>
    <footer aria-label="动作控制">
      <select id="side" aria-label="视角"><option value="front">正面</option><option value="back">背面</option></select>
      <select id="action" aria-label="动作"></select>
      <select id="part" aria-label="查看部位"></select>
      <button id="pause" type="button">暂停</button>
      <select id="speed" aria-label="播放速度"><option value="1">正常</option><option value=".5">半速</option><option value=".25">慢速</option></select>
      <button id="step" type="button" aria-label="下一帧">下一帧</button>
      <input id="progress" type="range" min="0" max="1" step=".001" value="0" aria-label="拖动动作进度">
      <span id="time">0.00 / 0.00</span>
    </footer>
  </main>
  <script src="../../vendor/pixi.min.js"></script>
  <script src="../../vendor/pixi-spine.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
