<!doctype html><html lang="zh"><meta charset="utf-8"><title>Spine 素材读回</title>
<style>body{margin:0;background:#e3e6e8}canvas{display:block}</style>
<script src="../../vendor/pixi.min.js"></script><script src="../../vendor/pixi-spine.js"></script>
<script type="module">
import {loadRig,poseRig,readRig} from './runtime.js';
const assets=[['2b-front','/dev/diy-2b/model/front/char_diy_2b.json'],['surtr-front','/assets/spine/op/char_350_surtr/front/char_350_surtr.skel'],['surtr-back','/assets/spine/op/char_350_surtr/back/char_350_surtr.skel']];
const app=new PIXI.Application({width:2100,height:820,backgroundColor:0xe3e6e8,antialias:true,preserveDrawingBuffer:true});document.body.append(app.view);
window.inventory={};window.rigs={};
try {
for(let i=0;i<assets.length;i++){
 const [id,url]=assets[i];const sp=await loadRig(url);window.rigs[id]=sp;
 poseRig(sp,sp.spineData.findAnimation('Idle')?'Idle':null,.15);
 const raw=readRig(sp);window.inventory[id]=raw;
 const bounds=sp.getLocalBounds();const scale=Math.min(1.8,610/Math.max(bounds.width,1),690/Math.max(bounds.height,1));sp.scale.set(scale);sp.position.set(350+i*700-(bounds.x+bounds.width/2)*scale,765-(bounds.y+bounds.height)*scale);app.stage.addChild(sp);
 const title=new PIXI.Text(id,{fontSize:22,fill:0x152c39});title.position.set(i*700+20,10);app.stage.addChild(title);
 const markers=new PIXI.Graphics();app.stage.addChild(markers);
 for(const bone of raw.bones.filter(b=>!b.id.startsWith('F_Rb_'))){const x=sp.x+bone.world[0]*scale,y=sp.y-bone.world[1]*scale;markers.lineStyle(1,0x005fad,.5).drawCircle(x,y,2);if(/head|body|arm|leg|hip|foot|hand|sword|thigh|shin|neck|torso/i.test(bone.id)){const label=new PIXI.Text(bone.id,{fontSize:11,fill:0xaa1838});label.position.set(x+3,y);app.stage.addChild(label);}}
}
window.__ready=true;document.title='ready';
}catch(e){window.__error=String(e.stack);document.title='error';}
</script></html>
